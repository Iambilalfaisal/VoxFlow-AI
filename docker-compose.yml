services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-voxflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-voxflow}
      POSTGRES_DB: ${POSTGRES_DB:-voxflow}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-voxflow}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Transaction-pooling proxy in front of Postgres. FastAPI/SQLAlchemy connect
  # here (not directly to postgres) so many async workers can share a small
  # number of real backend connections.
  pgbouncer:
    image: edoburu/pgbouncer:latest
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-voxflow}:${POSTGRES_PASSWORD:-voxflow}@postgres:5432/${POSTGRES_DB:-voxflow}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 20
      AUTH_TYPE: scram-sha-256
    ports:
      - "6432:5432"  # pgbouncer listens on 5432 internally regardless of the external port we expose it on
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      # Inside the compose network we use service names/internal ports, not
      # the host-published ones .env has for running outside Docker.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-voxflow}:${POSTGRES_PASSWORD:-voxflow}@pgbouncer:5432/${POSTGRES_DB:-voxflow}
      MIGRATIONS_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-voxflow}:${POSTGRES_PASSWORD:-voxflow}@postgres:5432/${POSTGRES_DB:-voxflow}
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      pgbouncer:
        condition: service_started

  worker:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-voxflow}:${POSTGRES_PASSWORD:-voxflow}@pgbouncer:5432/${POSTGRES_DB:-voxflow}
      MIGRATIONS_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-voxflow}:${POSTGRES_PASSWORD:-voxflow}@postgres:5432/${POSTGRES_DB:-voxflow}
    command: python worker/agent.py dev
    volumes:
      - .:/app
    depends_on:
      pgbouncer:
        condition: service_started

volumes:
  pgdata:
