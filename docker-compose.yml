services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-voxflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-voxflow}
      POSTGRES_DB: ${POSTGRES_DB:-voxflow}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-voxflow}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Transaction-pooling proxy in front of Postgres. FastAPI/SQLAlchemy connect
  # here (not directly to postgres) so many async workers can share a small
  # number of real backend connections.
  pgbouncer:
    image: edoburu/pgbouncer:latest
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-voxflow}:${POSTGRES_PASSWORD:-voxflow}@postgres:5432/${POSTGRES_DB:-voxflow}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 20
      AUTH_TYPE: scram-sha-256
    ports:
      - "6432:5432"  # pgbouncer listens on 5432 internally regardless of the external port we expose it on
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      # Inside the compose network we use service names/internal ports, not
      # the host-published ones .env has for running outside Docker.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-voxflow}:${POSTGRES_PASSWORD:-voxflow}@pgbouncer:5432/${POSTGRES_DB:-voxflow}
      MIGRATIONS_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-voxflow}:${POSTGRES_PASSWORD:-voxflow}@postgres:5432/${POSTGRES_DB:-voxflow}
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      pgbouncer:
        condition: service_started

  worker:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-voxflow}:${POSTGRES_PASSWORD:-voxflow}@pgbouncer:5432/${POSTGRES_DB:-voxflow}
      MIGRATIONS_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-voxflow}:${POSTGRES_PASSWORD:-voxflow}@postgres:5432/${POSTGRES_DB:-voxflow}
      # Inside the compose network this must be the service name, not
      # .env's localhost:6379 (which is only correct when running outside
      # Docker) - without this override the worker silently falls back to a
      # Redis it can't reach.
      REDIS_URL: redis://redis:6379/0
      # Only the worker needs this: every job runs in its own OS subprocess
      # (LiveKit Agents' process pool), so Prometheus metrics must use
      # multiprocess mode (see core/metrics.py) rather than one in-memory
      # registry that a job's process would take with it on exit.
      PROMETHEUS_MULTIPROC_DIR: /tmp/voxflow-metrics
    command: python worker/agent.py dev
    volumes:
      - .:/app
    depends_on:
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy

  # Drains the history-events Redis stream that worker/agent.py publishes to
  # and does the actual batched Postgres inserts. Kept as its own service so
  # it scales independently of the audio-processing worker. Phase 1 runs
  # exactly one instance - see worker/history_writer.py's module comment.
  history-writer:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-voxflow}:${POSTGRES_PASSWORD:-voxflow}@pgbouncer:5432/${POSTGRES_DB:-voxflow}
      MIGRATIONS_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-voxflow}:${POSTGRES_PASSWORD:-voxflow}@postgres:5432/${POSTGRES_DB:-voxflow}
      REDIS_URL: redis://redis:6379/0
    command: python worker/history_writer.py
    volumes:
      - .:/app
    depends_on:
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy

  # --- Observability (Phase 3 Part A) ---------------------------------------
  # Scrapes /metrics on api, worker (:9090), history-writer (:9091) - see
  # core/metrics.py and observability/prometheus.yml. Gated app-side by
  # settings.enable_observability, not by anything here.
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - api
      - worker
      - history-writer

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - jaeger

  # All-in-one Jaeger: UI + OTLP HTTP receiver (core/tracing.py's
  # OTEL_EXPORTER_OTLP_TRACES_ENDPOINT points at :4318/v1/traces).
  jaeger:
    image: jaegertracing/all-in-one:latest
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4318:4318"

  # Community exporter for pgbouncer's own SHOW POOLS stats - not hand-parsed
  # here. Swap the image if you prefer a different maintained exporter.
  pgbouncer-exporter:
    image: spreaker/prometheus-pgbouncer-exporter:latest
    environment:
      PGBOUNCER_EXPORT_HOST: pgbouncer
      PGBOUNCER_EXPORT_PORT: "5432"
      PGBOUNCER_EXPORT_USER: ${POSTGRES_USER:-voxflow}
      PGBOUNCER_EXPORT_PASSWORD: ${POSTGRES_PASSWORD:-voxflow}
    depends_on:
      pgbouncer:
        condition: service_started

volumes:
  pgdata:
