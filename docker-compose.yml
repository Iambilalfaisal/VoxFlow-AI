services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-voxflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-voxflow}
      POSTGRES_DB: ${POSTGRES_DB:-voxflow}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-voxflow}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Transaction-pooling proxy in front of Postgres. FastAPI/SQLAlchemy connect
  # here (not directly to postgres) so many async workers can share a small
  # number of real backend connections.
  pgbouncer:
    image: edoburu/pgbouncer:latest
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-voxflow}:${POSTGRES_PASSWORD:-voxflow}@postgres:5432/${POSTGRES_DB:-voxflow}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 20
      AUTH_TYPE: scram-sha-256
    ports:
      - "6432:6432"
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
